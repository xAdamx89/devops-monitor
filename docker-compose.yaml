services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: monitoring-dozzle
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Bindowanie tylko na localhost – nie wystawia panelu bezpośrednio w świat
      - "127.0.0.1:8888:8080"
    volumes:
      # Dostęp do socketa Dockera wyłącznie w trybie read-only
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    environment:
      - DOZZLE_NO_ANALYTICS=true
      # Odkomentuj, jeśli chcesz wystawiać Dozzle pod ścieżką (np. domena.pl/dozzle)
      # - DOZZLE_BASE=/dozzle
      # Odkomentuj, jeśli chcesz wbudowane logowanie (wymaga pliku users.yml)
      # - DOZZLE_AUTH_PROVIDER=simple
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  beszel:
    image: henrygd/beszel:latest
    container_name: monitoring-beszel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Panel WWW Beszel dostępny tylko lokalnie (np. pod reverse proxy / tunel SSH)
      - "127.0.0.1:8090:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: monitoring-beszel-agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # network_mode: host jest wymagane, aby agent widział prawdziwy ruch sieciowy serwera
    network_mode: host
    volumes:
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Komunikacja z Hubem przez plik socketu – nie otwiera żadnego portu TCP na hoście
      LISTEN: /beszel_socket/beszel.sock
      # Wklej tutaj klucz publiczny SSH wygenerowany przy dodawaniu systemu w panelu Beszel
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK6QtDpYXTvZiCdb0EJkuS/kl4We7Mah8/u4orWziIsr"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    name: monitoring_net
    driver: bridge

volumes:
  dozzle_data:
  beszel_data:
  beszel_socket:
